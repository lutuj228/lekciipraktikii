
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Dog API</title>
</head>
<body>
    <h1>Список пород собак</h1>

    <ol>
        {% for breed in breeds %}
            <li>{{ breed }}</li>
        {% endfor %}
    </ol>

    <h2>Поиск фотографий собак</h2>

    <form method="get">
        <label for="breeds">
            Введите породы через запятую:
        </label>

        <input
            type="text"
            id="breeds"
            name="breeds"
            placeholder="african, chow, dingo"
            required
        >

        <button type="submit">Найти</button>
    </form>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    {% if dog_images %}
        <h2>Фотографии выбранных пород</h2>

        {% for breed, image in dog_images.items %}
            <h3>{{ breed }}</h3>

            <img
                src="{{ image }}"
                alt="{{ breed }}"
                width="300"
            >
        {% endfor %}
    {% endif %}
</body>
</html>
